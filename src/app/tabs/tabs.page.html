<ion-tabs>

  <ion-tab-bar slot="bottom" *ngIf="rolUsuario !== 'ninguno'">

    <ng-container *ngIf="rolUsuario === 'cliente'">
      <ion-tab-button tab="tab3" href="/tabs/tab3">
        <ion-icon name="home-outline"></ion-icon>
        <ion-label>Inicio</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="tab6" href="/tabs/tab6">
        <ion-icon name="calendar-outline"></ion-icon>
        <ion-label>Consultas</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="tab7" href="/tabs/tab7">
        <ion-icon name="person-outline"></ion-icon>
        <ion-label>Perfil</ion-label>
      </ion-tab-button>
    </ng-container>

    <ng-container *ngIf="rolUsuario === 'admin'">
      <ion-tab-button tab="tab4" href="/tabs/tab4">
        <ion-icon name="business-outline"></ion-icon>
        <ion-label>Admin Home</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="tab5" href="/tabs/tab5">
        <ion-icon name="chatbubbles-outline"></ion-icon>
        <ion-label>Consultas</ion-label>
      </ion-tab-button>
    </ng-container>

  </ion-tab-bar>

</ion-tabs>
