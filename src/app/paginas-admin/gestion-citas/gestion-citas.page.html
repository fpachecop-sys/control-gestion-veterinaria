<ion-header class="ion-no-border">
  <ion-toolbar style="--background: #ffffff; padding-top: 5px;">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab4" text="" color="dark"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <div class="admin-header">
    <div>
      <h2 class="user-name">Hola Admin</h2>
      <p class="welcome-text">¡Bienvenido de Vuelta!</p>
    </div>
    <img src="assets/icon/logo.jpg" alt="Logo" class="mini-logo">
  </div>

  <hr class="divider">

  <div class="listado-section">
    <div class="title-with-icon">
      <ion-icon name="calendar" class="section-icon"></ion-icon>
      <h3 class="section-title">Listado de Citas</h3>
    </div>

    <div class="action-container">
      <button class="btn-agregar-cita-moderno ion-activatable">
        <ion-icon name="add-circle-outline"></ion-icon>
        AGREGAR CITA
        <ion-ripple-effect></ion-ripple-effect>
      </button>
    </div>

    <div class="contenedor-tarjetas">

      <div class="tarjeta-cita">
        <div class="tarjeta-main-content">
          <h3 class="nombre-mascota">Canela</h3>
          <p class="txt-dueno"><strong>Dueño:</strong> Franco Pacheco</p>

          <div class="bloque-horario">
            <h2>30/11/2025 | 21:30</h2>
          </div>

          <div class="badge-estado atendida">
            <span>ATENDIDA</span>
          </div>
        </div>

        <div class="detalles-sub-box">
          <p><strong>Veterinario:</strong> Dr. Roberto Vega</p>
          <p><strong>Motivo:</strong> Quimioterapia</p>
        </div>

        <div class="tarjeta-acciones">
          <button class="btn-card editar ion-activatable">
            EDITAR
            <ion-ripple-effect></ion-ripple-effect>
          </button>
          <button class="btn-card eliminar ion-activatable">
            ELIMINAR
            <ion-ripple-effect></ion-ripple-effect>
          </button>
        </div>
      </div>

      <div class="tarjeta-cita">
        <div class="tarjeta-main-content">
          <h3 class="nombre-mascota">Toby</h3>
          <p class="txt-dueno"><strong>Dueño:</strong> Maria Torres</p>

          <div class="bloque-horario">
            <h2>01/12/2025 | 09:15</h2>
          </div>

          <div class="badge-estado pendiente">
            <span>PENDIENTE</span>
          </div>
        </div>

        <div class="detalles-sub-box">
          <p><strong>Veterinario:</strong> Dra. Ana Martínez</p>
          <p><strong>Motivo:</strong> Control / Vacuna</p>
        </div>

        <div class="tarjeta-acciones">
          <button class="btn-card editar ion-activatable">
            EDITAR
            <ion-ripple-effect></ion-ripple-effect>
          </button>
          <button class="btn-card eliminar ion-activatable">
            ELIMINAR
            <ion-ripple-effect></ion-ripple-effect>
          </button>
        </div>
      </div>

    </div>
  </div>

</ion-content>
