<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title>Bandeja de Consultas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="bg-blanco">
  <div class="search-container">
    <ion-searchbar placeholder="Buscar dueño o mensaje..." mode="md"></ion-searchbar>
  </div>

  <div class="chat-list-wrapper">
    <ion-list lines="none">
      <ion-item *ngFor="let chat of listaChats" button (click)="abrirChatEspecifico(chat)" class="custom-chat-item">
        <div slot="start" class="avatar-iniciales">
          {{ obtenerIniciales(chat.nombre_cliente) }}
        </div>

        <ion-label>
          <div class="chat-header">
            <h3>{{ chat.nombre_cliente }}</h3>
            <span class="chat-tiempo">{{ chat.tiempo | date:'HH:mm' }}</span>
          </div>
          <p [ngClass]="{'no-leido': chat.no_leidos > 0}">
            {{ chat.ultimo_mensaje }}
          </p>
        </ion-label>

        <ion-badge slot="end" *ngIf="chat.no_leidos > 0">
          {{ chat.no_leidos }}
        </ion-badge>
      </ion-item>
    </ion-list>

    <div *ngIf="listaChats && listaChats.length === 0" class="sin-chats-container">
      <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
      <h4>Sin mensajes nuevos</h4>
      <p>Las dudas que envíen tus clientes aparecerán en esta sección de manera inmediata.</p>
    </div>
  </div>
</ion-content>
