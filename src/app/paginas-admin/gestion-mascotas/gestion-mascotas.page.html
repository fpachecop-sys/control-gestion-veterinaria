<ion-header class="ion-no-border">
  <ion-toolbar style="--background: #ffffff; padding-top: 5px;">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab4" text="" color="dark"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="bg-blanco ion-padding">

  <div class="header-bienvenida">
    <div class="saludo">
      <h2>Hola Admin</h2>
      <p>Bienvenido de Vuelta!</p>
    </div>
    <div class="logo-clinica">
      <img src="assets/icon/logo.jpg" alt="Logo" />
    </div>
  </div>

  <hr class="linea-divisoria" />

  <div class="titulo-seccion">
    <ion-icon name="paw" class="icono-patita"></ion-icon>
    <h2>Listado de Mascotas</h2>
  </div>

  <button class="boton-agregar-moderno ion-activatable" [routerLink]="['agregar-mascotas']">
    <ion-icon name="add-circle-outline"></ion-icon>
    AGREGAR MASCOTA
    <ion-ripple-effect></ion-ripple-effect>
  </button>

  <div class="contenedor-tarjetas">

  <div class="tarjeta-datos" *ngFor="let m of mascotas">
    <div class="tarjeta-header">
      <h3 class="nombre-principal">{{ m.nombre }}</h3>
      <span class="id-badge">ID: {{ m.id_mascota }}</span>
    </div>

    <div class="tag-especie">
      <span>{{ m.especie }} • {{ m.raza }}</span>
    </div>

    <div class="tarjeta-cuerpo">
      <div class="info-grupo">
        <label>Edad</label>
        <p>{{ m.edad }} {{ m.edad === 1 ? 'año' : 'años' }}</p>
      </div>
      <div class="info-grupo">
        <label>Dueño</label>
        <p>{{ m.dueno }}</p> </div>
    </div>

    <div class="tarjeta-acciones">
      <button class="btn-moderno editar ion-activatable">
        EDITAR
        <ion-ripple-effect></ion-ripple-effect>
      </button>
      <button class="btn-moderno eliminar ion-activatable">
        ELIMINAR
        <ion-ripple-effect></ion-ripple-effect>
      </button>
    </div>
  </div>

</div>

</ion-content>
