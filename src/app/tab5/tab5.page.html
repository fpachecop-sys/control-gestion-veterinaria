<ion-content [fullscreen]="true" class="ion-padding">

  <div class="admin-header">
    <div>
      <h2 class="user-name">Hola Admin</h2>
      <p class="welcome-text">¡Bienvenido de Vuelta!</p>
    </div>
    <img src="assets/icon/logo.jpg" alt="Logo" class="mini-logo">
  </div>

  <hr class="divider">

  <div class="listado-section">
    <div class="title-with-icon">
      <ion-icon name="people" class="section-icon"></ion-icon>
      <h3 class="section-title">Listado de Dueños</h3>
    </div>

    <div class="action-container">
      <button class="btn-agregar-dueno">Agregar Dueño</button>
    </div>

    <div class="custom-table">
      <div class="table-header">
        <div style="flex: 0.8;">DNI</div>
        <div style="flex: 1.2;">Nombre</div>
        <div style="flex: 1.1;">Teléfono</div>
        <div style="flex: 1.2;">Dirección</div>
        <div style="flex: 1.3;">Acciones</div>
      </div>
      
      <div class="table-row">
        <div style="flex: 0.8;" class="text-truncate">75...</div>
        <div style="flex: 1.2;" class="text-truncate">Franc...</div>
        <div style="flex: 1.1;" class="text-truncate">96523...</div>
        <div style="flex: 1.2;" class="text-truncate">MZd...</div>
        <div style="flex: 1.3;" class="action-buttons">
          <span class="btn-edit">EDITAR</span>
          <span class="btn-divider">/</span>
          <span class="btn-delete">ELIMINAR</span>
        </div>
      </div>

      <div class="table-row empty-row">
        <div style="flex: 0.8;"></div><div style="flex: 1.2;"></div><div style="flex: 1.1;"></div><div style="flex: 1.2;"></div><div style="flex: 1.3;"></div>
      </div>
      <div class="table-row empty-row">
        <div style="flex: 0.8;"></div><div style="flex: 1.2;"></div><div style="flex: 1.1;"></div><div style="flex: 1.2;"></div><div style="flex: 1.3;"></div>
      </div>
      <div class="table-row empty-row">
        <div style="flex: 0.8;"></div><div style="flex: 1.2;"></div><div style="flex: 1.1;"></div><div style="flex: 1.2;"></div><div style="flex: 1.3;"></div>
      </div>
    </div>
  </div>

</ion-content>
