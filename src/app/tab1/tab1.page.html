<ion-content [fullscreen]="true" class="ion-padding ion-text-center">
  <div class="header-container">
    <img src="assets/icon/logo.jpg" alt="Logo" class="logo-img"> 
    <h1 class="main-title">Veterinaria Mascotas <br> Portalino y Rondon</h1>
    <p class="subtitle">Cuidamos a tu mejor amigo</p>
  </div>

  <hr class="divider">

  <div class="login-container ion-text-start">
    <h2 class="welcome-text">Bienvenido</h2>
    <p class="instruction-text">Inicia Sesión para continuar</p>

    <ion-item lines="outline" class="custom-input">
      <ion-label position="stacked">Correo Electrónico</ion-label>
      <ion-input type="email" placeholder="ejemplo@correo.com" [(ngModel)]="correo"></ion-input>
    </ion-item>

    <ion-item fill="outline" mode="md" class="custom-input">
      <ion-label position="stacked">Contraseña</ion-label>
      <ion-input type="password" placeholder="*********" [(ngModel)]="contrasena"></ion-input>
    </ion-item>

    <p class="forgot-password ion-text-end" 
    (click)="recuperarContrasena()">¿Olvidaste tu Contraseña?</p>

    <div class="button-group ion-text-center">
      <ion-button expand="block" shape="round" color="light" class="btn-login" (click)="iniciarSesion()">
        Inicia Sesión
      </ion-button>

      <p class="other-mode">o prueba otro modo</p>

      <ion-button expand="block" shape="round" fill="outline" color="dark" class="btn-faceid" (click)="activarFaceID()">
        Reconocimiento facial
      </ion-button>

      <p class="register-text">
        No tienes cuenta? <span [routerLink]="['/tabs/tab2']" class="Link-interactivo">Registrate</span></p>
    </div>
  </div>
</ion-content>
