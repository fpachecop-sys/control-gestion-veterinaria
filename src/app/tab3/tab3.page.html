<ion-content [fullscreen]="true" class="bg-claro">

  <div class="header-container ion-padding-horizontal">
    <div class="saludo-bloque">
      <h2>Hola Franco</h2>
      <p>Bienvenido de Vuelta!</p>
    </div>
    <div class="logo-bloque">
      <img src="assets/icon/logo.jpg" alt="Logo Veterinaria" class="logo-clinica" />
    </div>
    <div class="avatar-bloque">
      <div class="avatar-wrapper">
        <ion-icon name="person-circle-outline"></ion-icon>
        <span class="notificacion-badge"></span>
      </div>
    </div>
  </div>

  <div class="ion-padding-horizontal">
    <ion-searchbar placeholder="Buscar mascotas, citas...." class="buscador-personalizado"></ion-searchbar>
    
    <h3 class="seccion-titulo">Acciones Rapidas</h3>
    
    <ion-grid class="ion-no-padding">
      <ion-row>
        <ion-col size="6">
          <div class="cuadro-accion ion-activatable" [routerLink]="['/ubicacion']">
            <p>UBICACION</p>
            <ion-ripple-effect></ion-ripple-effect>
          </div>
        </ion-col>
        
        <ion-col size="6">
          <div class="cuadro-accion ion-activatable" [routerLink]="['/mascotas']">
            <p>MIS MASCOTAS</p>
            <ion-ripple-effect></ion-ripple-effect>
          </div>
        </ion-col>
      </ion-row>
      
      <ion-row>
        <ion-col size="6">
          <div class="cuadro-accion ion-activatable" [routerLink]="['/solicitar-consulta']">
            <p>SOLICITAR CONSULTA</p>
            <ion-ripple-effect></ion-ripple-effect>
          </div>
        </ion-col>
        
        <ion-col size="6">
          <div class="cuadro-accion ion-activatable" [routerLink]="['/historial']">
            <p>HISTORIAL</p>
            <ion-ripple-effect></ion-ripple-effect>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>

    <h3 class="seccion-titulo">Próximas Citas</h3>

    <div class="tarjeta-cita">
      <div class="bloque-fecha">
        <span class="dia-numero">15</span>
        <span class="mes-texto">NOV</span>
      </div>
      <div class="info-cita">
        <h4>Firulais - Vacunación</h4>
        <p class="detalle-hora">
          <ion-icon name="time-outline"></ion-icon> 10:00 AM
        </p>
        <p class="detalle-doctor">Dr. Roberto Vega</p>
      </div>
      <div class="estado-cita text-pendiente">
        <span>Pendiente</span>
      </div>
    </div>

    <div class="tarjeta-cita">
      <div class="bloque-fecha">
        <span class="dia-numero">18</span>
        <span class="mes-texto">NOV</span>
      </div>
      <div class="info-cita">
        <h4>Michi - Control</h4>
        <p class="detalle-hora">
          <ion-icon name="time-outline"></ion-icon> 2:30 PM
        </p>
        <p class="detalle-doctor">Dra. Ana Martínez</p>
      </div>
      <div class="estado-cita text-pendiente">
        <span>Pendiente</span>
      </div>
    </div>

  </div>
</ion-content>
